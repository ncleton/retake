name: Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: Vidéos de test
        run: |
          mkdir -p test/media
          ffmpeg -v error -f lavfi -i "testsrc2=size=1920x1080:rate=60:duration=180" -f lavfi -i "sine=frequency=440:duration=180" -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest test/media/video1.mp4
          ffmpeg -v error -f lavfi -i "testsrc=size=1280x720:rate=30:duration=40" -f lavfi -i "sine=frequency=330:duration=40" -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest test/media/video2.mp4
      - name: Test de bout en bout (code source)
        env:
          REVUE_TEST_VIDEO: test/media/video1.mp4
          REVUE_TEST_VIDEO2: test/media/video2.mp4
          REVUE_TEST_VOICE: test/fixtures/voix.wav
          REVUE_TEST_FRAME: '1200'
          REVUE_TEST_FRAME_POINT: '300'
        run: node test/e2e.mjs
      - name: Copie des captures du test source
        if: always()
        run: mkdir -p ci-captures/source && cp test/out/*.png ci-captures/source/ || true
      - name: Précision à l'image près contre ffmpeg
        env:
          REVUE_TEST_VIDEO: test/media/video1.mp4
          REVUE_TEST_FRAMES: '61,62,1574,5001,9000'
        run: node test/precision.mjs && python test/check_frames.py
      - name: Installateur Windows
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Test de bout en bout (application installable)
        env:
          REVUE_APP_EXECUTABLE: dist/win-unpacked/Revue.exe
          REVUE_TEST_VIDEO: test/media/video1.mp4
          REVUE_TEST_VIDEO2: test/media/video2.mp4
          REVUE_TEST_VOICE: test/fixtures/voix.wav
          REVUE_TEST_FRAME: '1200'
          REVUE_TEST_FRAME_POINT: '300'
        run: node test/e2e.mjs
      - name: Copie des captures de l'application installable
        if: always()
        run: mkdir -p ci-captures/installable && cp test/out/*.png ci-captures/installable/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-windows
          path: ci-captures
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-windows
          path: dist/*.exe

